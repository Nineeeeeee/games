<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:system-ui;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1rem}
h1{color:#f39c12;margin:.5rem 0}
#setup{display:flex;flex-direction:column;align-items:center;gap:.5rem;margin-top:2rem}
#setup input{padding:.6rem;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#fff;font-size:1rem;text-align:center;width:280px}
#setup input:focus{outline:none;border-color:#f39c12}
#setup button{padding:.6rem 2rem;border-radius:8px;border:none;background:#f39c12;color:#0a0a1a;font-weight:600;cursor:pointer}
#chat{display:none;flex-direction:column;align-items:center;width:100%;max-width:500px}
#msgs{width:100%;flex:1;overflow-y:auto;margin-bottom:.5rem;padding:.5rem;border:1px solid rgba(255,255,255,.1);border-radius:8px;min-height:300px;max-height:60vh}
.msg{margin:.3rem 0;padding:.3rem .5rem;border-radius:6px;background:rgba(255,255,255,.05)}
.msg .w{color:#f39c12;font-weight:600}.msg .t{color:#666;font-size:.7rem;margin-left:.5rem}.msg .m{display:block;word-break:break-all}
.info{color:#555;text-align:center;font-size:.8rem;margin:.3rem 0}
.rw{display:flex;gap:.5rem;width:100%;max-width:500px}
.rw input{flex:1;padding:.6rem;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#fff;font-size:1rem}
.rw input:focus{outline:none;border-color:#f39c12}
.rw button{padding:.6rem 1.2rem;border-radius:8px;border:none;background:#f39c12;color:#0a0a1a;font-weight:600;cursor:pointer}
.bar{color:#666;font-size:.8rem;margin-bottom:.5rem}.bar span{color:#2ecc71}
a{color:#888;text-decoration:none;font-size:.8rem;margin-top:1rem}
</style></head><body>
<div id="setup">
  <h1>Chat Test</h1>
  <input id="nm" placeholder="你的昵称" maxlength="12">
  <button onclick="connect()">进入聊天</button>
  <a href="../">← Back to Arcade</a>
</div>
<div id="chat">
  <div class="bar">在线: <span id="o">0</span></div>
  <div id="msgs"></div>
  <div class="rw">
    <input id="in" placeholder="输入消息..." maxlength="500">
    <button onclick="s()">发送</button>
  </div>
  <a href="#" onclick="location.reload()">← 离开</a>
</div>
<script>
var ws,n='';
var params=new URLSearchParams(location.search);
var svr=params.get('server');
var wsUrl=svr?'wss://'+svr:(location.protocol==='https:'?'wss':'ws')+'://'+location.host;

function connect(){
  n=document.getElementById('nm').value||'???';
  ws=new WebSocket(wsUrl);
  ws.onopen=function(){
    document.getElementById('setup').style.display='none';
    document.getElementById('chat').style.display='flex';
    ws.send(JSON.stringify({t:'join',n:n}));
  };
  ws.onmessage=function(e){
    var d=JSON.parse(e.data);
    if(d.t==='msg')a(d.n,d.m,1);else if(d.t==='join')a('',d.n+' 加入');else if(d.t==='leave')a('',d.n+' 离开');
    document.getElementById('o').textContent=d.c||0;
  };
  ws.onclose=function(){a('','断开连接');setTimeout(function(){location.reload()},3000);};
  ws.onerror=function(){a('','连接失败，检查 server 参数');};
}
function a(w,t,m){
  var d=document.getElementById('msgs'),e=document.createElement('div');
  if(m){e.className='msg';e.innerHTML='<span class="w">'+w+'</span><span class="t">'+new Date().toLocaleTimeString()+'</span><span class="m">'+t+'</span>';}
  else{e.className='info';e.textContent=t;}
  d.appendChild(e);d.scrollTop=d.scrollHeight;
}
function s(){var i=document.getElementById('in'),m=i.value.trim();if(!m)return;ws.send(JSON.stringify({t:'msg',m:m}));i.value='';i.focus();}
document.getElementById('in').addEventListener('keydown',function(e){if(e.key==='Enter')s();});
</script></body></html>
