<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⭕ Othello</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a1a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1rem;touch-action:none;
}
.home{text-align:center;margin-top:3rem}
.home h1{font-size:2.5rem;margin-bottom:.5rem}
.home input{
  padding:.6rem 1rem;border-radius:8px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.05);color:#fff;font-size:1rem;text-align:center;
  width:200px;margin:.5rem
}
.home input:focus{outline:none;border-color:#f39c12}
.btn{
  padding:.6rem 1.5rem;border-radius:8px;border:none;font-size:1rem;cursor:pointer;
  font-weight:600;transition:transform .15s,opacity .15s;margin:.3rem;
}
.btn:hover{transform:scale(1.03)}
.btn.primary{background:#f39c12;color:#0a0a1a}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.panel{display:none;flex-direction:column;align-items:center;width:100%;max-width:400px}
.panel.active{display:flex}
.game{display:none;flex-direction:column;align-items:center;width:100%;max-width:400px}
.game.active{display:flex}
.info{display:flex;justify-content:space-between;width:100%;margin-bottom:.5rem}
.info .player{padding:.3rem .8rem;border-radius:6px;font-size:.85rem;min-width:80px;text-align:center}
.info .player.active{border:2px solid #f39c12}
.info .player.black{background:rgba(0,0,0,.5)}
.info .player.white{background:rgba(255,255,255,.1)}
.info .score{font-size:1.2rem;font-weight:700}
.board-wall{display:grid;grid-template-columns:20px repeat(8,1fr) 20px;grid-template-rows:20px repeat(8,1fr);gap:0;width:100%;
  aspect-ratio:1;background:#1a5e2a;border-radius:4px;padding:4px;max-width:380px}
.cell{background:#2d8a4e;border:1px solid rgba(0,0,0,.2);border-radius:2px;position:relative;cursor:pointer}
.cell .piece{position:absolute;width:70%;height:70%;border-radius:50%;top:15%;left:15%}
.cell .piece.B{background:radial-gradient(circle at 35% 35%,#555,#000);box-shadow:2px 2px 4px rgba(0,0,0,.5)}
.cell .piece.W{background:radial-gradient(circle at 35% 35%,#fff,#ccc);box-shadow:2px 2px 4px rgba(0,0,0,.3)}
.cell .dot{position:absolute;width:20%;height:20%;border-radius:50%;background:rgba(255,255,255,.2);top:40%;left:40%}
.lbl{display:flex;align-items:center;justify-content:center;font-size:.6rem;color:rgba(255,255,255,.5)}
.status{margin:.5rem 0;font-size:.9rem;min-height:1.5rem}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);
  display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:100}
.overlay.hidden{display:none}
.overlay h2{font-size:2rem;margin-bottom:1rem}
.back-link{color:#888;text-decoration:none;margin-top:.5rem;font-size:.85rem}
.back-link:hover{color:#f39c12}
/* Room panel */
.room-card{background:rgba(255,255,255,.05);border-radius:12px;padding:2rem;width:100%;max-width:320px;text-align:center;margin-top:2rem}
.room-code{font-size:3rem;font-weight:700;color:#f39c12;letter-spacing:.3rem;margin:.5rem 0}
.player-list{margin:1.5rem 0}
.player-row{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem;margin:.5rem 0;border-radius:8px}
.player-row.host{background:rgba(243,156,18,.15);border:1px solid rgba(243,156,18,.3)}
.player-row.guest{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.player-row .name{font-size:1rem}
.player-row .tag{font-size:.75rem;padding:.15rem .5rem;border-radius:4px}
.player-row .tag.host-tag{background:#f39c12;color:#0a0a1a}
.player-row .tag.waiting-tag{background:rgba(255,255,255,.1);color:#888}
</style>
</head>
<body>

<!-- Lobby -->
<div class="home" id="lobby">
  <h1>⭕ Othello</h1>
  <p style="color:#888;margin-bottom:1rem">Multiplayer · Reversi</p>
  <input id="nameInput" placeholder="Your Name" maxlength="12">
  <br>
  <input id="roomInput" placeholder="Room Code" maxlength="4" style="display:none">
  <br>
  <button class="btn primary" onclick="createRoom()">Create Room</button>
  <button class="btn ghost" onclick="showJoin()" id="joinBtn">Join Room</button>
  <br><br>
  <a class="back-link" href="../">← Back to Arcade</a>
</div>

<!-- Room waiting panel -->
<div class="panel" id="roomPanel">
  <p style="color:#888;margin-top:1rem">Share this code with your friend</p>
  <div class="room-code" id="roomCode">----</div>
  <div class="room-card">
    <div class="player-list" id="playerList"></div>
    <button class="btn primary" id="startBtn" onclick="startGame()" style="display:none;width:100%;margin-top:.5rem">Start Game</button>
    <p id="waitMsg" style="color:#888;font-size:.9rem;margin-top:1rem">Waiting for opponent...</p>
  </div>
  <a class="back-link" href="#" onclick="leaveRoom()" style="margin-top:1rem">← Leave room</a>
</div>

<!-- Game board -->
<div class="game" id="game">
  <div class="info">
    <div class="player black" id="infoB"><div id="nameB">Black</div><div class="score" id="scoreB">2</div></div>
    <div class="status" id="status">Waiting...</div>
    <div class="player white" id="infoW"><div id="nameW">White</div><div class="score" id="scoreW">2</div></div>
  </div>
  <div class="board-wall" id="board"></div>
  <button class="btn ghost" style="margin-top:.5rem" onclick="location.reload()">Leave</button>
</div>

<div class="overlay hidden" id="overlay">
  <h2 id="overlayTitle"></h2>
  <p id="overlayMsg"></p>
  <button class="btn primary" id="overlayBtn" onclick="location.reload()">Play Again</button>
</div>

<script>
let ws,myRole,myRoom,myName;

const params=new URLSearchParams(location.search);
const svr=params.get('server');
const wsUrl=svr?`wss://${svr}`:(location.protocol==='https:'?'wss':'ws')+'://'+location.host;

function toast(msg,c){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:'+(c||'#e74c3c')+';color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:999;max-width:90%;text-align:center';
  d.textContent=msg;document.body.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .5s';setTimeout(()=>d.remove(),500)},5000);
}

function showPanel(id){
  document.querySelectorAll('.home,.panel,.game').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.home,.panel,.game').forEach(el=>el.style.display='none');
  const el=document.getElementById(id);
  el.style.display='flex';el.classList.add('active');
}

function connect(url){
  ws=new WebSocket(url);
  ws.onopen=()=>{toast('Connected!','#27ae60');};
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    if(d.type==='created'){
      myRoom=d.room;myRole=d.player;
      document.getElementById('roomCode').textContent=d.room;
      showPanel('roomPanel');
      updatePlayerList([{name:myName,role:'host'},{name:'?',role:'guest'}]);
      if(myRole==='host'){
        document.getElementById('startBtn').style.display='block';
        document.getElementById('waitMsg').textContent='Waiting for opponent...';
      }
    }else if(d.type==='joined'){
      myRoom=d.room;myRole=d.player;
      document.getElementById('roomCode').textContent=d.room;
      showPanel('roomPanel');
      updatePlayerList([{name:'?',role:'host'},{name:myName,role:'guest'}]);
      document.getElementById('startBtn').style.display='none';
      document.getElementById('waitMsg').textContent='Waiting for host to start...';
    }else if(d.type==='room_update'){
      updatePlayerList(d.players);
      if(myRole==='host' && d.players[1] && d.players[1].name!=='?'){
        document.getElementById('startBtn').disabled=false;
        document.getElementById('waitMsg').textContent='Opponent ready! Start the game.';
      }
    }else if(d.type==='game_start'){
      showPanel('game');
      document.getElementById('nameB').textContent=d.black;
      document.getElementById('nameW').textContent=d.white;
      document.getElementById('status').textContent='\u25cf '+d.black+'\'s turn';
      updateBoard(d.board,d.moves,d.score);
    }else if(d.type==='state'){
      const turnName=d.turn==='B'?d.black:d.white;
      document.getElementById('status').textContent=(d.turn==='B'?'\u25cf ':'\u25cb ')+turnName+'\'s turn';
      if(d.gameover){
        let t=d.winner==='draw'?'\ud83e\udd1d Draw!':(d.winner==='B'?'\ud83d\udda4 '+d.black+' wins!':'\ud83e\udd0d '+d.white+' wins!');
        showOverlay(t,d.black+' '+d.score[0]+' - '+d.score[1]+' '+d.white);
      }
      updateBoard(d.board,d.moves,d.score);
    }else if(d.type==='disconnected'){
      toast(d.msg||'Opponent disconnected');
      setTimeout(()=>{showPanel('lobby');},2000);
    }else if(d.type==='error'){
      toast('Error: '+d.msg);
    }
  };
  ws.onclose=()=>{toast('Disconnected','#e74c3c');};
  ws.onerror=()=>{toast('Cannot connect to server','#e74c3c');};
}

function updatePlayerList(players){
  const list=document.getElementById('playerList');
  list.innerHTML='';
  const colors={host:'#f39c12',guest:'#fff'};
  players.forEach((p,i)=>{
    const row=document.createElement('div');
    row.className='player-row '+(i===0?'host':'guest');
    const nameSpan=document.createElement('span');
    nameSpan.className='name';
    nameSpan.textContent=p.name||'?'+(p.name==='?'?' (empty)':'');
    row.appendChild(nameSpan);
    const tag=document.createElement('span');
    tag.className='tag '+(p.role==='host'?'host-tag':'waiting-tag');
    tag.textContent=p.role==='host'?'Host':'Player 2';
    row.appendChild(tag);
    list.appendChild(row);
  });
}

function updateBoard(board, moves, score){
  document.getElementById('scoreB').textContent=score[0];
  document.getElementById('scoreW').textContent=score[1];
  document.getElementById('infoB').className='player black'+(myRole==='host'?' active':'');
  document.getElementById('infoW').className='player white'+(myRole==='guest'?' active':'');
  for(let i=0;i<64;i++){
    const cell=document.getElementById('c'+i);
    const existing=cell.querySelector('.piece,.dot');
    if(existing)existing.remove();
    if(board[i]!=='.'){
      const piece=document.createElement('div');
      piece.className='piece '+board[i];
      cell.appendChild(piece);
    }else if(moves.includes(i)){
      const dot=document.createElement('div');
      dot.className='dot';
      dot.onclick=()=>ws.send(JSON.stringify({cmd:'move',pos:i}));
      cell.appendChild(dot);
    }
  }
}

function buildBoard(){
  const b=document.getElementById('board');
  const te=document.createElement('div');te.className='lbl';b.appendChild(te);
  for(let c=0;c<8;c++){
    const l=document.createElement('div');l.className='lbl';
    l.textContent=c+1;b.appendChild(l);
  }
  const te2=document.createElement('div');te2.className='lbl';b.appendChild(te2);
  for(let r=0;r<8;r++){
    const left=document.createElement('div');left.className='lbl';
    left.textContent=String.fromCharCode(65+r);b.appendChild(left);
    for(let c=0;c<8;c++){
      const cell=document.createElement('div');cell.className='cell';cell.id='c'+(r*8+c);
      b.appendChild(cell);
    }
    const right=document.createElement('div');right.className='lbl';
    right.textContent=String.fromCharCode(65+r);b.appendChild(right);
  }
}

function sendCmd(cmd,retries=10){
  if(ws && ws.readyState===WebSocket.OPEN){
    ws.send(JSON.stringify(cmd));
    return;
  }
  if(retries<=0){toast('Connection not ready, try again');return;}
  setTimeout(()=>sendCmd(cmd,retries-1),500);
}

function createRoom(){
  myName=document.getElementById('nameInput').value||'Player';
  sendCmd({cmd:'create',name:myName});
}

function showJoin(){
  document.getElementById('roomInput').style.display='inline';
  document.getElementById('joinBtn').textContent='Join';
  document.getElementById('joinBtn').onclick=joinGame;
}

function joinGame(){
  myName=document.getElementById('nameInput').value||'Player';
  const room=document.getElementById('roomInput').value.trim();
  if(!room){toast('Enter room code');return;}
  sendCmd({cmd:'join',room,name:myName});
}

function startGame(){
  sendCmd({cmd:'start'});
}

function leaveRoom(){
  ws.close();
  showPanel('lobby');
}

function showOverlay(title,msg){
  document.getElementById('overlayTitle').textContent=title;
  document.getElementById('overlayMsg').textContent=msg;
  document.getElementById('overlay').classList.remove('hidden');
}

buildBoard();
connect(wsUrl);
</script>
</body>
</html>
