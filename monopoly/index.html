<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎲 大富翁</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a1a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1rem;touch-action:none;
}
.home{text-align:center;margin-top:3rem}
.home h1{font-size:2.5rem;margin-bottom:.5rem}
.home input{
  padding:.6rem 1rem;border-radius:8px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.05);color:#fff;font-size:1rem;text-align:center;
  width:200px;margin:.5rem
}
.home input:focus{outline:none;border-color:#f39c12}
.btn{
  padding:.6rem 1.5rem;border-radius:8px;border:none;font-size:1rem;cursor:pointer;
  font-weight:600;transition:transform .15s,opacity .15s;margin:.3rem;
}
.btn:hover{transform:scale(1.03)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:#f39c12;color:#0a0a1a}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff}
.btn.sm{padding:.4rem 1rem;font-size:.85rem}
.panel{display:none;flex-direction:column;align-items:center;width:100%;max-width:500px}
.panel.active{display:flex}
.back-link{color:#888;text-decoration:none;margin-top:.5rem;font-size:.85rem}
.back-link:hover{color:#f39c12}
/* Room */
.room-card{background:rgba(255,255,255,.05);border-radius:12px;padding:2rem;width:100%;text-align:center;margin-top:1rem}
.room-code{font-size:3rem;font-weight:700;color:#f39c12;letter-spacing:.3rem;margin:.5rem 0}
.player-list{margin:1rem 0}
.player-row{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem;margin:.3rem 0;border-radius:8px;background:rgba(255,255,255,.05)}
.player-row .dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:.5rem}
.player-row .name{font-size:.95rem}
.player-row .tag{font-size:.75rem;padding:.15rem .5rem;border-radius:4px;background:#f39c12;color:#0a0a1a}
.player-row.waiting .tag{background:rgba(255,255,255,.1);color:#888}
/* Game */
.game-panel{display:none;flex-direction:column;align-items:center;width:100%;max-width:500px}
.game-panel.active{display:flex}
canvas{border-radius:8px;display:block;max-width:100%;height:auto}
.info-bar{width:100%;margin-top:.5rem;display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.info-item{background:rgba(255,255,255,.05);border-radius:8px;padding:.4rem .8rem;font-size:.8rem;min-width:80px;text-align:center}
.info-item .val{font-size:1rem;font-weight:600;margin-top:.2rem}
.info-item .val.positive{color:#2ecc71}
.info-item .val.negative{color:#e74c3c}
.msg-box{background:rgba(255,255,255,.08);border-radius:8px;padding:.6rem 1rem;margin:.5rem 0;font-size:.85rem;text-align:center;width:100%;min-height:2.5rem;display:flex;align-items:center;justify-content:center;color:#ddd}
.action-bar{display:flex;gap:.5rem;margin-top:.3rem;flex-wrap:wrap;justify-content:center}
.dice-display{font-size:2.5rem;margin:.3rem 0;min-height:3rem}
.overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.85);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:10
}
.overlay.hidden{display:none}
@media(max-width:500px){
  .room-code{font-size:2.5rem}
  canvas{max-width:calc(100vw - 2rem)}
  .info-item{font-size:.7rem;min-width:60px;padding:.3rem .6rem}
}
</style>
</head>
<body>

<!-- Lobby -->
<div class="home" id="lobby">
  <h1>🎲 大富翁</h1>
  <p style="color:#888;margin-bottom:1rem">Multiplayer Monopoly</p>
  <input id="nameInput" placeholder="名字" maxlength="12">
  <br>
  <input id="roomInput" placeholder="房间号" maxlength="4" style="display:none">
  <br>
  <button class="btn primary" onclick="createRoom()">Create Room</button>
  <button class="btn ghost" onclick="showJoin()" id="joinBtn">Join Room</button>
  <br><br>
  <a class="back-link" href="../">← Back to Arcade</a>
</div>

<!-- Room Panel -->
<div class="panel" id="roomPanel">
  <p style="color:#888;margin-top:1rem">Share this code with friends</p>
  <div class="room-code" id="roomCode">----</div>
  <div class="room-card">
    <div class="player-list" id="playerList"></div>
    <button class="btn primary" id="startBtn" onclick="startGame()" style="display:none;width:100%;margin-top:.5rem">Start Game</button>
    <p id="waitMsg" style="color:#888;font-size:.9rem;margin-top:1rem">Waiting for players...</p>
  </div>
  <a class="back-link" href="#" onclick="leaveRoom()" style="margin-top:1rem">← Leave</a>
</div>

<!-- Game -->
<div class="game-panel" id="gamePanel">
  <canvas id="boardCanvas"></canvas>
  <div class="dice-display" id="diceDisplay">🎲</div>
  <div class="msg-box" id="msgBox">游戏开始！</div>
  <div class="info-bar" id="infoBar"></div>
  <div class="action-bar" id="actionBar"></div>
</div>

<!-- Decision Overlay -->
<div class="overlay hidden" id="decisionOverlay">
  <h2 id="decisionTitle" style="font-size:1.3rem;margin-bottom:.5rem"></h2>
  <p id="decisionMsg" style="color:#aaa;margin-bottom:1.5rem"></p>
  <div id="decisionBtns"></div>
</div>

<script>
// ===== Board Data =====
const CELLS = [
  {name:'起点',type:'start',price:0,rent:0},
  {name:'东街',type:'property',price:200,rent:50},
  {name:'机会',type:'chance',price:0,rent:0},
  {name:'南街',type:'property',price:220,rent:55},
  {name:'缴税',type:'tax',price:0,rent:0},
  {name:'西街',type:'property',price:260,rent:65},
  {name:'北街',type:'property',price:280,rent:70},
  {name:'人民路',type:'property',price:300,rent:75},
  {name:'监狱',type:'jail',price:0,rent:0},
  {name:'南京路',type:'property',price:320,rent:80},
  {name:'淮海路',type:'property',price:350,rent:85},
  {name:'机会',type:'chance',price:0,rent:0},
  {name:'延安路',type:'property',price:370,rent:90},
  {name:'长安街',type:'property',price:390,rent:95},
  {name:'解放路',type:'property',price:420,rent:100},
  {name:'建设路',type:'property',price:450,rent:110},
  {name:'免费停车',type:'parking',price:0,rent:0},
  {name:'黄河路',type:'property',price:480,rent:120},
  {name:'长江路',type:'property',price:500,rent:130},
  {name:'机会',type:'chance',price:0,rent:0},
  {name:'珠江路',type:'property',price:520,rent:140},
  {name:'泰山路',type:'property',price:550,rent:150},
  {name:'华山道',type:'property',price:580,rent:160},
  {name:'昆仑关',type:'property',price:600,rent:170},
  {name:'前往监狱',type:'gojail',price:0,rent:0},
  {name:'前门大街',type:'property',price:200,rent:50},
  {name:'王府井',type:'property',price:220,rent:55},
  {name:'机会',type:'chance',price:0,rent:0},
  {name:'外滩',type:'property',price:260,rent:65},
  {name:'陆家嘴',type:'property',price:280,rent:70},
  {name:'缴税',type:'tax',price:0,rent:0},
  {name:'中关村',type:'property',price:300,rent:75},
];

const COLORS = ['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22'];
const GRID=9;
const PARAMS=new URLSearchParams(location.search);
const SVR=PARAMS.get('server');
const WS_URL=SVR?`wss://${SVR}`:(location.protocol==='https:'?'wss':'ws')+'://'+location.host;

let ws,myIdx,myRoom,myName,gameState=null,cellSize=0;

function pos(i){
  if(i<=8) return {r:8,c:i};
  if(i<=16) return {r:16-i,c:8};
  if(i<=24) return {r:0,c:24-i};
  return {r:i-24,c:0};
}

function toast(m,c){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:'+(c||'#e74c3c')+';color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:999;max-width:90%;text-align:center';
  d.textContent=m;document.body.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .5s';setTimeout(()=>d.remove(),500)},5000);
}

function showPanel(id){
  document.querySelectorAll('.home,.panel,.game-panel').forEach(e=>{e.style.display='none';e.classList.remove('active')});
  const el=document.getElementById(id);
  el.style.display='flex';el.classList.add('active');
}

function sendCmd(cmd,retries=10){
  if(ws&&ws.readyState===WebSocket.OPEN){ws.send(JSON.stringify(cmd));return;}
  if(retries<=0){toast('连接未就绪');return;}
  setTimeout(()=>sendCmd(cmd,retries-1),500);
}

function connect(){
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>toast('Connected!','#27ae60');
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    switch(d.type){
      case 'created':
        myRoom=d.room;myIdx=d.player_idx;
        document.getElementById('roomCode').textContent=d.room;
        showPanel('roomPanel');
        updatePlayerList(d.players,d.max_players);
        document.getElementById('startBtn').style.display='block';
        document.getElementById('waitMsg').textContent='Waiting for players...';
        break;
      case 'joined':
        myRoom=d.room;myIdx=d.player_idx;
        document.getElementById('roomCode').textContent=d.room;
        showPanel('roomPanel');
        updatePlayerList(d.players,d.max_players);
        document.getElementById('startBtn').style.display='none';
        document.getElementById('waitMsg').textContent='Waiting for host to start...';
        break;
      case 'room_update':
        updatePlayerList(d.players,d.max_players||4);
        break;
      case 'game_start':
        showPanel('gamePanel');
        gameState={players:d.players};
        initCanvas();
        break;
      case 'state':
        gameState=d;
        renderBoard();
        renderInfo();
        document.getElementById('msgBox').textContent=d.message||'';
        updateDice(d.dice);
        updateActions(d);
        hideDecision();
        break;
      case 'your_turn':
        toast('轮到你了！','#27ae60');
        break;
      case 'need_decision':
        showDecision(d);
        break;
      case 'game_over':
        document.getElementById('msgBox').textContent=d.message||'游戏结束';
        renderBoard();
        renderInfo();
        showOverlay('🏆 '+d.winner+' 获胜！');
        break;
      case 'error':
        toast('错误: '+d.msg);
        break;
      case 'disconnected':
        toast(d.msg||'玩家掉线');
        break;
    }
  };
  ws.onclose=()=>{if(!gameState)toast('连接断开','#e74c3c')};
  ws.onerror=()=>toast('无法连接服务器','#e74c3c');
}

// ===== Lobby Functions =====
function createRoom(){
  myName=document.getElementById('nameInput').value||'Player';
  sendCmd({cmd:'create',name:myName});
}
function showJoin(){
  document.getElementById('roomInput').style.display='inline';
  document.getElementById('joinBtn').textContent='Join';
  document.getElementById('joinBtn').onclick=joinGame;
}
function joinGame(){
  myName=document.getElementById('nameInput').value||'Player';
  const room=document.getElementById('roomInput').value.trim();
  if(!room){toast('输入房间号');return;}
  sendCmd({cmd:'join',room,name:myName});
}
function startGame(){sendCmd({cmd:'start'});}
function leaveRoom(){ws.close();showPanel('lobby');};

function updatePlayerList(players,maxP){
  const list=document.getElementById('playerList');
  list.innerHTML='';
  const labels=['房主','','','','',''];
  players.forEach((p,i)=>{
    const row=document.createElement('div');
    row.className='player-row';
    if(i===0)row.style.border='1px solid '+p.color;
    row.innerHTML='<span><span class="dot" style="background:'+p.color+'"></span><span class="name">'+
      p.name+'</span></span><span class="tag">'+(i===0?'Host':'Player '+(i+1))+'</span>';
    list.appendChild(row);
  });
  for(let i=players.length;i<maxP;i++){
    const row=document.createElement('div');
    row.className='player-row waiting';
    row.innerHTML='<span><span class="dot" style="background:#333"></span><span class="name" style="color:#555">等待加入...</span></span>';
    list.appendChild(row);
  }
}

// ===== Canvas =====
function initCanvas(){
  const canvas=document.getElementById('boardCanvas');
  const maxW=Math.min(window.innerWidth-32,480);
  cellSize=Math.floor(maxW/GRID);
  canvas.width=cellSize*GRID;
  canvas.height=cellSize*GRID;
  canvas.style.width=canvas.width+'px';
  canvas.style.height=canvas.height+'px';
  renderBoard();
}

function cellColor(type){
  switch(type){
    case 'property':return 'rgba(46,204,113,.15)';
    case 'chance':return 'rgba(243,156,18,.15)';
    case 'tax':return 'rgba(231,76,60,.15)';
    case 'start':return 'rgba(46,204,113,.3)';
    case 'jail':return 'rgba(149,165,166,.2)';
    case 'parking':return 'rgba(46,204,113,.2)';
    case 'gojail':return 'rgba(231,76,60,.25)';
    default:return 'rgba(255,255,255,.05)';
  }
}

function renderBoard(){
  const canvas=document.getElementById('boardCanvas');
  const ctx=canvas.getContext('2d');
  const s=cellSize;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  
  // Background
  ctx.fillStyle='#1a5e2a';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  
  // Inner area
  ctx.fillStyle='#0a0a1a';
  ctx.fillRect(s,s,canvas.width-2*s,canvas.height-2*s);
  
  // Inner text
  ctx.fillStyle='rgba(255,255,255,.1)';
  ctx.font=Math.floor(s*1.2)+'px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🎲',canvas.width/2,canvas.height/2-10);
  ctx.font=Math.floor(s*0.35)+'px sans-serif';
  ctx.fillStyle='rgba(255,255,255,.3)';
  ctx.fillText('MONOPOLY',canvas.width/2,canvas.height/2+s*0.5);
  
  // Draw cells
  for(let i=0;i<32;i++){
    const p=pos(i);
    const cell=CELLS[i];
    const x=p.c*s, y=p.r*s;
    const w=s, h=s;
    const isInner=r=>r>0&&r<8&&c>0&&c<8;
    
    // Background
    ctx.fillStyle=cellColor(cell.type);
    ctx.fillRect(x,y,w,h);
    
    // Border
    ctx.strokeStyle='rgba(255,255,255,.1)';
    ctx.lineWidth=1;
    ctx.strokeRect(x,y,w,h);
    
    // Property color bar
    if(cell.type==='property'){
      const barH=s*0.12;
      ctx.fillStyle='#2ecc71';
      ctx.fillRect(x,y,w,barH);
      // Owner indicator
      if(gameState&&gameState.owner_names&&gameState.owner_names[i]!==null&&gameState.owner_names[i]!==undefined){
        const oIdx=gameState.board[i];
        if(oIdx>=0&&oIdx<gameState.players.length){
          ctx.fillStyle=COLORS[oIdx]||'#fff';
          ctx.fillRect(x,y+barH,w,Math.floor(s*0.05));
        }
      }
    }
    
    // Cell name
    ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.font=Math.floor(s*0.2)+'px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(cell.name,x+w/2,y+h/2+(cell.type==='property'?s*0.1:0));
    
    // Price
    if(cell.type==='property'){
      ctx.fillStyle='rgba(255,255,255,.4)';
      ctx.font=Math.floor(s*0.17)+'px sans-serif';
      ctx.fillText('$'+cell.price,x+w/2,y+h/2+s*0.2);
    }
    
    // Corner icons
    if(i===0){ctx.font=Math.floor(s*0.4)+'px sans-serif';ctx.fillText('🚀',x+w/2,y+h/2)}
    if(i===8){ctx.font=Math.floor(s*0.4)+'px sans-serif';ctx.fillText('🔒',x+w/2,y+h/2)}
    if(i===16){ctx.font=Math.floor(s*0.4)+'px sans-serif';ctx.fillText('🅿️',x+w/2,y+h/2)}
    if(i===24){ctx.font=Math.floor(s*0.4)+'px sans-serif';ctx.fillText('👮',x+w/2,y+h/2)}
    if(i===2||i===11||i===19||i===27){ctx.font=Math.floor(s*0.3)+'px sans-serif';ctx.fillText('❓',x+w/2,y+h/2+s*0.15)}
  }
  
  // Draw players
  if(gameState&&gameState.players){
    gameState.players.forEach((p,i)=>{
      if(!p.alive)return;
      const pp=pos(p.pos);
      const cx=pp.c*s+s*0.3+s*0.4*(i%3);
      const cy=pp.r*s+s*0.25+Math.floor(i/3)*s*0.35;
      ctx.beginPath();
      ctx.arc(cx,cy,s*0.15,0,Math.PI*2);
      ctx.fillStyle=p.color;
      ctx.fill();
      ctx.strokeStyle='#fff';
      ctx.lineWidth=1.5;
      ctx.stroke();
      ctx.fillStyle='#fff';
      ctx.font=Math.floor(s*0.15)+'px sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText((i+1).toString(),cx,cy);
    });
  }
}

function renderInfo(){
  const bar=document.getElementById('infoBar');
  if(!gameState||!gameState.players)return;
  bar.innerHTML='';
  gameState.players.forEach((p,i)=>{
    const el=document.createElement('div');
    el.className='info-item';
    el.style.border=i===gameState.current?'2px solid '+p.color:'';
    const current=i===myIdx?' (你)':'';
    el.innerHTML=`<div style="color:${p.color}">${p.name}${current}</div>
      <div class="val ${p.money>=0?'positive':'negative'}">$${p.money}</div>
      <div style="font-size:.7rem;color:#666">${p.props.length}处地产</div>`;
    bar.appendChild(el);
  });
}

function updateDice(dice){
  const el=document.getElementById('diceDisplay');
  if(!dice||dice.length===0){el.textContent='🎲';return;}
  const d=dice[0];
  const faces=['','⚀','⚁','⚂','⚃','⚄','⚅'];
  el.textContent=faces[d]||d;
}

function updateActions(state){
  const bar=document.getElementById('actionBar');
  bar.innerHTML='';
  if(state.phase==='ended')return;
  if(myIdx!==state.current){bar.innerHTML='<span style="color:#666;font-size:.9rem">等待其他玩家...</span>';return;}
  if(state.phase==='rolling')bar.innerHTML='<button class="btn primary" onclick="sendCmd({cmd:\'roll\'})">🎲 掷骰子</button>';
  if(state.phase==='done')bar.innerHTML='<button class="btn primary" onclick="sendCmd({cmd:\'end_turn\'})">✅ 结束回合</button>';
}

function showDecision(d){
  const ov=document.getElementById('decisionOverlay');
  ov.classList.remove('hidden');
  document.getElementById('decisionTitle').textContent=d.cell_name;
  document.getElementById('decisionMsg').textContent='售价 $'+d.price+' ｜ 余额 $'+d.money;
  const btns=document.getElementById('decisionBtns');
  btns.innerHTML='<button class="btn primary" onclick="sendCmd({cmd:\'buy\'});hideDecision()">🏠 购买</button>'+
    '<button class="btn ghost" onclick="sendCmd({cmd:\'skip_buy\'});hideDecision()">跳过</button>';
}
function hideDecision(){document.getElementById('decisionOverlay').classList.add('hidden')}

function showOverlay(msg){
  document.getElementById('decisionTitle').textContent=msg;
  document.getElementById('decisionMsg').textContent='';
  document.getElementById('decisionBtns').innerHTML='<button class="btn primary" onclick="location.reload()">再来一局</button>';
  document.getElementById('decisionOverlay').classList.remove('hidden');
}

// Resize handler
window.addEventListener('resize',()=>{if(gameState)initCanvas()});

// Init
connect();
</script>
</body>
</html>
